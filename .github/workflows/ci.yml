name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant in-progress runs when new commits are pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source-integrity:
    name: Source Integrity (fail-fast)
    runs-on: ubuntu-latest
    # Pure TS syntax/type sweep with no WASM/native build. Ambient module
    # declarations (src/custom.d.ts `*.wasm`) let tsc resolve wasm imports
    # without physical .wasm artifacts, so a broken .ts/.tsx fails here in
    # seconds instead of after minutes of WASM/Rust/Emscripten compilation
    # in the Lint + Test job below (see #1075).
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          # Pins to pnpm 9 to match pnpm-lock.yaml lockfileVersion '9.0'.
          # Avoids the Apr-2026 pnpm-lock mutation bug in setup-node + pnpm
          # cache interaction — see: pnpm/action-setup#226.

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (tsc, no WASM build)
        run: pnpm exec tsc -b --pretty false

  ci:
    name: Lint + Test
    needs: source-integrity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # jc303_wasm is a git submodule; build:wasm:jc303 below needs its
          # source. (This job builds WASM — source-integrity above does not.)

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          # Pins to pnpm 9 to match pnpm-lock.yaml lockfileVersion '9.0'.
          # Avoids the Apr-2026 pnpm-lock mutation bug in setup-node + pnpm
          # cache interaction — see: pnpm/action-setup#226.

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'


      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51
          no-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python metrics deps
        run: pip install numpy scipy

      - name: Build WASM artifacts
        run: pnpm run build:wasm

      - name: Validate WASM export map
        # Fails when hyphon_wasm_export_map.json is missing a required export,
        # carries unexpected export bloat, or has drifted from the built glue.
        # Skips cleanly (exit 0 + warning) when no WASM artifacts were built.
        run: pnpm run check:exports

      - name: Type-check (tsc)
        run: pnpm exec tsc -b

      - name: Lint (ESLint)
        # eslint.config.js globalIgnores excludes emsdk/, assembly/, emscripten/,
        # jc303_wasm/, rubberband/, and public/. Lint is now clean on src/, so
        # failures here must be fixed rather than masked.
        run: pnpm lint


      - name: Test (Vitest)
        # WASM artifacts are gitignored and intentionally not built in Phase 1.
        # Vitest tests degrade gracefully via fs.existsSync guards in WASM tests.
        # pool=forks performs better than default worker_threads on 2-vCPU runners.
        run: pnpm exec vitest run --pool forks
        env:
          CI: true

      - name: Test (offline 303 engines, host g++)
        # Renders the 303 engines natively via the emscripten stubs — no emsdk
        # needed. Covers the TB-303 output-level alignment gate, which has to
        # sweep LEVEL through the real DSP and so cannot run from Vitest against
        # the committed baselines (those are all rendered at a single LEVEL).
        run: bash emscripten/tests/run_offline_voices_test.sh
