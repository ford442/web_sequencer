name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant in-progress runs when new commits are pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source-integrity:
    name: Source Integrity (fail-fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (tsc, no WASM build)
        run: pnpm exec tsc -b --pretty false

  lint:
    name: Lint
    needs: source-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

  # Promoted to run as an early gate to catch Vite import-resolution failures without building WASM
  test-unit:
    name: Unit tests (Vitest)
    needs: source-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (unit tier — no WASM build, hermetic fetch guard)
        run: pnpm run test:unit
        env:
          CI: true

  test-integration:
    name: Integration + native tests
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51
          no-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python metrics deps
        run: pip install numpy scipy

      - name: Cache native artifacts
        uses: actions/cache@v4
        with:
          path: |
            src/wasm/
            public/hyphon_native.js
            public/hyphon_native.wasm
            public/hyphon_native.worker.js
            public/hyphon_wasm_export_map.json
            public/jc303-single.js
            public/jc303-single.wasm
            public/jc303-single-worklet.js
            public/jc303-threaded.js
            public/jc303-threaded.wasm
            public/jc303-threaded.worker.js
            public/jc303-threaded-worklet.js
            public/rust-wasm/
            rust-audio/target
            jc303_wasm/wasm/build_threaded
            jc303_wasm/wasm/build_single
            .cache/native/
          key: native-${{ runner.os }}-emcc3.1.51-${{ hashFiles('assembly/**', 'rust-audio/src/**', 'rust-audio/Cargo.lock', 'emscripten/**', 'rubberband/src/**', 'jc303_wasm/**', 'tools/build_jc303_omp.sh', 'tools/jc303_cmake/**', 'package.json') }}

      - name: Build native artifacts (incremental)
        run: pnpm run build:native:changed

      - name: Validate WASM export map
        run: pnpm run check:exports --glue public/hyphon_native.js

      - name: Test (integration tier)
        run: pnpm run test:integration
        env:
          CI: true

      - name: Test (offline 303 engines, host g++)
        run: pnpm run test:native
