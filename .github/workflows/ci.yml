name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant in-progress runs when new commits are pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source-integrity:
    name: Source Integrity (fail-fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard pnpm/action-setup vs packageManager
        run: node scripts/check-pnpm-action-setup.mjs

      - name: Type-check (tsc, no WASM build)
        run: pnpm exec tsc -b --pretty false

  lint:
    name: Lint
    needs: source-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint ratchet (deferred-rule counts may only go down)
        run: pnpm run lint:ratchet

  lint-strict:
    name: Lint (strict ratchet, informational)
    needs: source-integrity
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full gradualTypeRules set project-wide (see AGENTS.md's rollout tracker).
      # Non-blocking: utils/engines/hooks/stores/components have only the first
      # two rules (no-floating-promises + no-unsafe-assignment) on, so the other
      # seven are expected to fail until that ratchet finishes — this job exists
      # so the ratchet's progress is visible in CI without gating merges.
      - name: Lint (ESLint, full strict rule set)
        run: pnpm run lint:strict

  # Promoted to run as an early gate to catch Vite import-resolution failures without building WASM
  test-unit:
    name: Unit tests (Vitest)
    needs: source-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (unit tier — no WASM build, hermetic fetch guard)
        run: pnpm run test:unit
        env:
          CI: true

  test-integration:
    name: Integration + native tests
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'


      - name: Read Emscripten pin
        # The one pin (BUILD_NOTES#toolchain-pin); build scripts refuse any other emcc.
        id: emsdk-pin
        run: echo "version=$(jq -r .emscripten.version emscripten/toolchain.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.emsdk-pin.outputs.version }}
          no-cache: false

      - name: Rust wasm32 target
        # rust-* and dwgs-* oscillator voices (public/rust_osc.wasm #1664,
        # public/dwgs_osc.wasm #1666). The runner image ships rustup + stable;
        # neither crate has dependencies.
        run: rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python metrics deps
        run: pip install numpy scipy

      - name: Cache native artifacts
        uses: actions/cache@v4
        with:
          path: |
            src/wasm/
            public/hyphon_native.js
            public/hyphon_native.wasm
            public/hyphon_wasm_export_map.json
            public/hyphon_native.st.js
            public/hyphon_native.st.wasm
            public/hyphon_wasm_export_map.st.json
            .cache/native/
          key: native-${{ runner.os }}-emcc${{ steps.emsdk-pin.outputs.version }}-${{ hashFiles('assembly/**', 'emscripten/**', 'rubberband/src/**', 'jc303_wasm/src/**', 'third_party/eurorack/plaits/**', 'third_party/stmlib/**', 'tools/plaits_*.mjs', 'rust-audio/**', 'dwgs-audio/**', 'package.json') }}

      - name: Build native artifacts (incremental)
        run: pnpm run build:native:changed

      # So a contributor without emsdk can restore the exact set this commit
      # built (docs/deployment/RELEASE_BUILD.md#native-artifacts). .cache/native/
      # carries the stamps + native-artifacts.json that make
      # `build:release:changed` skip the rebuild.
      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-artifacts
          path: |
            src/wasm/
            public/hyphon_native.js
            public/hyphon_native.wasm
            public/hyphon_wasm_export_map.json
            public/hyphon_native.st.js
            public/hyphon_native.st.wasm
            public/hyphon_wasm_export_map.st.json
            public/rubberband.wasm
            public/mix_bus.wasm
            public/rust_osc.wasm
            public/cpp_osc.wasm
            public/cpp_osc_scalar.wasm
            public/dwgs_osc.wasm
            .cache/native/
          if-no-files-found: error
          retention-days: 14

      - name: Validate WASM export map
        run: |
          pnpm run check:exports --require-artifacts --glue public/hyphon_native.js --wasm public/hyphon_native.wasm
          pnpm run check:exports --require-artifacts --skip-modules --map public/hyphon_wasm_export_map.st.json --glue public/hyphon_native.st.js --wasm public/hyphon_native.st.wasm

      - name: Validate WAM2 catalog integrity
        # A community package edited without `pnpm run wam:integrity` would be
        # refused by the installer at runtime; fail here instead.
        run: pnpm run check:wam

      - name: Release dist gate (bundle budgets + worklet invariants)
        # Same check build:release runs; without it here, dist regressions only
        # ever turned the Playwright E2E badge red.
        run: pnpm run vendor:pyodide && pnpm run build:web && node scripts/write-native-manifest.mjs --out dist/native-artifacts.json && node scripts/check-release-dist.mjs

      - name: Bundle report (budget headroom, report only)
        # Never fails the job - the gate is check-release-dist.mjs above. This
        # only makes the headroom visible on the run page. For a before/after
        # delta locally: `node scripts/analyze-bundle.mjs --json > base.json` on
        # the base commit, then `pnpm run bundle:compare base.json` on yours.
        if: always()
        continue-on-error: true
        run: |
          node scripts/analyze-bundle.mjs --json > /tmp/bundle-report.json
          node scripts/analyze-bundle.mjs --compare /tmp/bundle-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Test (integration tier)
        run: pnpm run test:integration
        env:
          CI: true
          HYPHON_REQUIRE_NATIVE: '1'

      - name: Test (offline 303 engines, host g++)
        run: pnpm run test:native
