name: Staging deploy

# Manual: build the exact release bundle from a ref, deploy it to the STAGING
# folder of the deploy host (never production), then verify the response headers
# (COOP/COEP/CORP), that the host serves this commit, and run the release smoke
# (tests/release-smoke.spec.ts) against the deployed URL.
#
# One-time setup (repo settings, outside this workflow):
#   secrets.DEPLOY_TOKEN              deploy token (same as production's)
#   vars.DEPLOY_STAGING_ENDPOINT      bundle endpoint of a staging folder on the deploy host
#   vars.STAGING_URL                  public URL of that folder, e.g. https://host/hyphon-staging/
# The staging folder itself must exist server-side and be served with the same
# COOP/COEP/CORP headers as production; this workflow fails if it is not.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build and deploy to staging
        required: false
        default: main
      report_issue:
        description: Optional issue / PR number to post the "State of the App" report on
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Rust wasm32 target
        # rust-* oscillator voices (public/rust_osc.wasm, #1664): `pnpm run build`
        # is build:release, whose build:native builds the rust-osc world.
        run: rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pinned emscripten
        uses: actions/cache@v4
        with:
          path: .cache/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('emscripten/toolchain.json') }}

      - name: Install pinned emscripten
        run: pnpm run setup:emsdk

      - name: Build release bundle (build + check-release-dist)
        run: pnpm run build

      - name: Deploy to staging
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_STAGING_ENDPOINT: ${{ vars.DEPLOY_STAGING_ENDPOINT }}
        run: python3 deploy.py --target staging

      - name: Verify headers and served commit
        run: node scripts/check-deploy-headers.mjs "${{ vars.STAGING_URL }}" --expect-sha "$(git rev-parse HEAD)"

      # The same build, now served by the staging host: 0 console errors, 0 failed requests,
      # crossOriginIsolated, native engines on hyphon_native, exports non-empty, session round-trip.
      # No retries: a smoke that needs a second attempt is not a gate.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Release smoke against staging
        env:
          DEPLOY_SMOKE_URL: ${{ vars.STAGING_URL }}
        run: pnpm exec playwright test tests/release-smoke.spec.ts tests/deploy-smoke.spec.ts --project=chromium --workers=1 --retries=0 --reporter=github,list

      # Release 3/5: viewport x state matrix against the DEPLOYED build (not localhost): layout facts in every
      # browser plus pixel comparison against the committed baselines (tests/__screenshots__). Zero unexpected
      # console errors; the intentionally triggered error states are listed in the report.
      - name: Visual matrix against staging
        env:
          DEPLOY_SMOKE_URL: ${{ vars.STAGING_URL }}
        run: pnpm exec playwright test tests/visual-showcase.spec.ts --project=chromium --project=firefox --workers=1 --retries=0 --reporter=github,list

      - name: Build State of the App report
        if: always()
        run: node scripts/visual-report.mjs --in visual-report --url "${{ vars.STAGING_URL }}" --sha "$(git rev-parse HEAD)"

      - name: Post State of the App report
        if: always() && inputs.report_issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat visual-report/REPORT.md
            echo
            echo "Screenshot grid (every viewport x state, per browser): artifact \`staging-smoke-report\` of ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > comment.md
          gh issue comment "${{ inputs.report_issue }}" --repo "$GITHUB_REPOSITORY" --body-file comment.md

      - name: Upload staging smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-report
          path: |
            release-smoke-report/
            visual-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
