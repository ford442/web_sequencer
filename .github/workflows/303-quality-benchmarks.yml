name: 303 Quality & Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  spectrogram-quality:
    name: Spectrogram / stress Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51
          no-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python metrics deps
        run: pip install numpy scipy

      - name: Cache native artifacts
        uses: actions/cache@v4
        with:
          path: |
            src/wasm/
            public/hyphon_native.js
            public/hyphon_native.wasm
            public/hyphon_native.worker.js
            public/hyphon_wasm_export_map.json
            public/jc303-single.js
            public/jc303-single.wasm
            public/jc303-single-worklet.js
            public/jc303-threaded.js
            public/jc303-threaded.wasm
            public/jc303-threaded.worker.js
            public/jc303-threaded-worklet.js
            public/rust-wasm/
            rust-audio/target
            jc303_wasm/wasm/build_threaded
            jc303_wasm/wasm/build_single
            .cache/native/
          key: native-${{ runner.os }}-emcc3.1.51-${{ hashFiles('assembly/**', 'rust-audio/src/**', 'rust-audio/Cargo.lock', 'emscripten/**', 'rubberband/src/**', 'jc303_wasm/**', 'tools/build_jc303_omp.sh', 'tools/jc303_cmake/**', 'package.json') }}

      - name: Build native artifacts (incremental)
        run: pnpm run build:native:changed

      - name: Run spectrogram quality + stress integration tests
        run: |
          pnpm run test:integration -- \
            TB303SpectrogramQuality \
            Offline303Stress \
            tb303AuthenticityMetrics
        env:
          CI: true

  offline-benchmark:
    name: Offline render benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51
          no-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python metrics deps
        run: pip install numpy scipy

      - name: Cache native artifacts
        uses: actions/cache@v4
        with:
          path: |
            src/wasm/
            public/hyphon_native.js
            public/hyphon_native.wasm
            public/hyphon_native.worker.js
            public/hyphon_wasm_export_map.json
            public/jc303-single.js
            public/jc303-single.wasm
            public/jc303-single-worklet.js
            public/jc303-threaded.js
            public/jc303-threaded.wasm
            public/jc303-threaded.worker.js
            public/jc303-threaded-worklet.js
            public/rust-wasm/
            rust-audio/target
            jc303_wasm/wasm/build_threaded
            jc303_wasm/wasm/build_single
            .cache/native/
          key: native-${{ runner.os }}-emcc3.1.51-${{ hashFiles('assembly/**', 'rust-audio/src/**', 'rust-audio/Cargo.lock', 'emscripten/**', 'rubberband/src/**', 'jc303_wasm/**', 'tools/build_jc303_omp.sh', 'tools/jc303_cmake/**', 'package.json') }}

      - name: Build native artifacts (incremental)
        run: pnpm run build:native:changed

      - name: Run offline 303 benchmark
        run: pnpm exec vite-node scripts/benchmark_offline303.mjs --json benchmark-303-offline.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-303-offline
          path: benchmark-303-offline.json
          retention-days: 30
