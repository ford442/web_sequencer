name: Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Read Emscripten pin
        # The one pin (BUILD_NOTES#toolchain-pin); build scripts refuse any other emcc.
        id: emsdk-pin
        run: echo "version=$(jq -r .emscripten.version emscripten/toolchain.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.emsdk-pin.outputs.version }}
          no-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Gitignored; without it hyphon_native cannot mark Pyodide ready and
      # INITIALIZE SYSTEM stays disabled (canStart = isPyodideReady && hasNativeModule).
      - name: Vendor Pyodide runtime
        run: pnpm run vendor:pyodide
      - name: Cache native artifacts
        uses: actions/cache@v4
        with:
          path: |
            src/wasm/
            public/hyphon_native.js
            public/hyphon_native.wasm
            public/hyphon_wasm_export_map.json
            public/hyphon_native.st.js
            public/hyphon_native.st.wasm
            public/hyphon_wasm_export_map.st.json
            public/rust-wasm/
            rust-audio/target
            .cache/native/
          key: native-${{ runner.os }}-emcc${{ steps.emsdk-pin.outputs.version }}-${{ hashFiles('assembly/**', 'rust-audio/src/**', 'rust-audio/Cargo.lock', 'emscripten/**', 'rubberband/src/**', 'jc303_wasm/src/**', 'third_party/eurorack/plaits/**', 'third_party/stmlib/**', 'tools/plaits_*.mjs', 'package.json') }}
      - name: Build
        run: pnpm run build:release:changed
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      # Headless Firefox needs an audio sink: without one AudioContext.resume()
      # never settles and the transport clock never ticks (#1372). The null sink
      # that tests/global-setup.ts starts comes from this package.
      - name: Install PulseAudio
        run: sudo apt-get install -y --no-install-recommends pulseaudio
      # Playwright webServer starts `vite preview` (COOP/COEP via vite.config.ts).
      # Do not background preview in a separate step — GHA kills that process group
      # when the step ends, then Playwright falls back to Vite *dev*, which cannot
      # load public/hyphon_native.js.
      # One worker: two AudioContexts + pthread WASM abort Chromium/WebKit.
      - name: Run Playwright tests
        run: pnpm exec playwright test --workers=1 --reporter=github

      # Traces are retain-on-failure (playwright.config.ts). Without this,
      # a red run leaves only the truncated GitHub-reporter log to debug from.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
