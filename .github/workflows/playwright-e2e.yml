name: Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51
          no-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
      - name: Build
        run: pnpm run build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      # Using `preview` instead of `http-server` because Vite sets the required COOP/COEP headers for Pyodide's SharedArrayBuffer.
      - name: Serve dist on port 5173
        run: pnpm run preview --port 5173 & sleep 5
      - name: Run Playwright tests
        run: pnpm exec playwright test --reporter=github

      # Traces are captured on first retry (playwright.config.ts). Without this,
      # a red run leaves only the truncated GitHub-reporter log to debug from.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
