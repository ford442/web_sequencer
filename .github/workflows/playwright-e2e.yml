name: Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51
          no-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache native artifacts
        uses: actions/cache@v4
        with:
          path: |
            src/wasm/
            public/hyphon_native.js
            public/hyphon_native.wasm
            public/hyphon_native.worker.js
            public/hyphon_wasm_export_map.json
            public/jc303-single.js
            public/jc303-single.wasm
            public/jc303-single-worklet.js
            public/jc303-threaded.js
            public/jc303-threaded.wasm
            public/jc303-threaded.worker.js
            public/jc303-threaded-worklet.js
            public/rust-wasm/
            rust-audio/target
            jc303_wasm/wasm/build_threaded
            jc303_wasm/wasm/build_single
            .cache/native/
          key: native-${{ runner.os }}-emcc3.1.51-${{ hashFiles('assembly/**', 'rust-audio/src/**', 'rust-audio/Cargo.lock', 'emscripten/**', 'rubberband/src/**', 'jc303_wasm/**', 'tools/build_jc303_omp.sh', 'tools/jc303_cmake/**', 'package.json') }}
      - name: Build
        run: pnpm run build:release:changed
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      # Using `preview` instead of `http-server` because Vite sets the required COOP/COEP headers for Pyodide's SharedArrayBuffer.
      - name: Serve dist on port 5173
        run: pnpm run preview --port 5173 & sleep 5
      - name: Run Playwright tests
        run: pnpm exec playwright test --reporter=github

      # Traces are captured on first retry (playwright.config.ts). Without this,
      # a red run leaves only the truncated GitHub-reporter log to debug from.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
