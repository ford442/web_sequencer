name: Diagnostic Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-diagnose:
    runs-on: ubuntu-latest

    steps:
    # 1. CHECKOUT (No submodules initially to prevent config errors)
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 0

    # 2. INSTALL PNPM (Essential Fix from previous step)
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    # 3. SETUP NODE (Disable caching to avoid service outages)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # cache: 'pnpm'  <-- COMMENTED OUT to avoid cache errors

    # 4. SETUP EMSCRIPTEN (Disable explicit cache folder)
    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.51
        no-cache: true   # <-- NEW: Force disable caching to bypass 400 errors

    # 5. INSTALL DEPENDENCIES
    - name: Install Dependencies
      run: pnpm install --no-frozen-lockfile

    # 6. RUN THE BUILDS
    - name: 🛠️ Build WASM Modules
      run: |
        chmod +x emscripten/*.sh
        chmod +x tools/*.sh
        
        echo ">>> Building Rubberband..."
        ./emscripten/build.sh
        
        echo ">>> Building JC303..."
        ./tools/build_jc303_omp.sh

    # 7. BUILD WEB APP
    - name: 🏗️ Build Web Application
      run: pnpm build

    # 8. VERIFY OUTPUT
    - name: 🔍 Debug - Verify Output
      run: |
        ls -lh public/*.wasm || echo "❌ No WASM files in public/"
        ls -lh public/*.js || echo "❌ No JS glue files in public/"

    # 9. UPLOAD ARTIFACTS (Attempt upload, but continue if service is down)
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      continue-on-error: true # <-- Don't fail the build if GitHub storage is down
      with:
        name: debug-build-output
        path: dist/
