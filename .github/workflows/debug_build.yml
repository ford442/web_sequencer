name: Diagnostic Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-diagnose:
    runs-on: ubuntu-latest

    steps:
    # 1. CHECKOUT
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: false 
        fetch-depth: 0

    # 2. INSTALL PNPM (Must run before setup-node)
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        run_install: false

    # 3. SETUP NODE
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    # 4. SETUP EMSCRIPTEN (*** UPDATED VERSION ***)
    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.70  # <--- UPDATED: Fixes 'wasm-opt' flag error
        no-cache: true   # Keep this true to avoid GitHub service 400 errors

    # 5. INSTALL DEPENDENCIES
    - name: Install Dependencies
      run: pnpm install --no-frozen-lockfile

    # 6. DIAGNOSTIC: Check Files
    - name: 🔍 Debug - Verify Source
      run: |
        echo "Checking emscripten folder..."
        ls -F emscripten/ || echo "emscripten folder missing"

    # 7. RUN THE BUILDS
    - name: 🛠️ Build WASM Modules
      run: |
        chmod +x emscripten/*.sh
        chmod +x tools/*.sh
        
        echo ">>> Building Rubberband..."
        ./emscripten/build.sh
        
        echo ">>> Building JC303..."
        ./tools/build_jc303_omp.sh

    # 8. BUILD WEB APP
    - name: 🏗️ Build Web Application
      run: pnpm build

    # 9. VERIFY OUTPUT
    - name: 🔍 Debug - Verify Output
      run: |
        echo "Checking for build artifacts..."
        ls -lh public/*.wasm || echo "❌ No WASM files in public/"
        ls -lh public/*.js || echo "❌ No JS glue files in public/"

    # 10. UPLOAD ARTIFACTS
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: debug-build-output
        path: dist/
