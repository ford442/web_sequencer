name: Diagnostic Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-diagnose:
    runs-on: ubuntu-latest

    steps:
    # 1. CHECKOUT CODE
    # set submodules to false to prevent the "No url found" crash.
    # Your build.sh script handles the cloning manually now.
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: false 
        fetch-depth: 0

    # 2. INSTALL PNPM (*** NEW STEP ***)
    # This must run BEFORE setup-node
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    # 3. SETUP NODE.JS
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    # 4. SETUP EMSCRIPTEN
    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.51
        actions-cache-folder: 'emsdk-cache'

    # 5. INSTALL DEPENDENCIES
    - name: Install Dependencies
      run: pnpm install

    # 6. DIAGNOSTIC: Check Files Before Build
    - name: 🔍 Debug - Verify Source
      run: |
        echo "Checking directory structure..."
        ls -F
        echo "Checking emscripten folder..."
        ls -F emscripten/ || echo "emscripten folder missing"

    # 7. RUN THE BUILDS
    - name: 🛠️ Build WASM Modules
      run: |
        chmod +x emscripten/*.sh
        chmod +x tools/*.sh
        
        echo ">>> Building Rubberband..."
        ./emscripten/build.sh
        
        echo ">>> Building JC303..."
        ./tools/build_jc303_omp.sh

    # 8. BUILD WEB APP
    - name: 🏗️ Build Web Application
      run: pnpm build

    # 9. VERIFY OUTPUT
    - name: 🔍 Debug - Verify Output
      run: |
        echo "Checking public folder artifacts..."
        ls -lh public/*.wasm || echo "❌ No WASM files in public/"
        ls -lh public/*.js || echo "❌ No JS glue files in public/"

    # 10. UPLOAD ARTIFACTS
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debug-build-output
        path: dist/
