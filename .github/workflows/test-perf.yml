name: Test Performance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  perf:
    name: Vitest perf tier
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'perf')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run perf tier (isolated fork, warm-up + median policy)
        run: pnpm run test:perf
        env:
          CI: true

      - name: Collect perf summary
        run: node scripts/collect-vitest-perf.mjs perf-summary.json
        env:
          VITEST_PERF_SUMMARY: perf-summary.json

      - name: Upload perf artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitest-perf-summary
          path: perf-summary.json
          retention-days: 30
