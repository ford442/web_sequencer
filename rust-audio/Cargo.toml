[package]
name = "rust_osc"
version = "0.2.0"
edition = "2021"
description = "Hyphon `rust-*` oscillator family: a no_std, SIMD, worklet-resident band-limited kernel (#1664)"
publish = false

# No dependencies on purpose: the module is instantiated by hand inside an
# AudioWorkletGlobalScope (src/audio-worklets/rust-osc-processor.ts) with an
# empty import object. No wasm-bindgen, no allocator, no std.
[dependencies]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

[profile.dev]
panic = "abort"
