<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyphon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Roboto Mono', monospace;
        background-color: #111827;
        color: #e5e7eb;
        overflow-x: hidden;
      }
      .font-orbitron {
        font-family: 'Orbitron', sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1f2937;
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6b7280;
      }
      input[type='number']::-webkit-inner-spin-button,
      input[type='number']::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type='number'] {
        -moz-appearance: textfield;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Where pyodide_bootstrap.js (bundled into hyphon_native.js via --post-js)
      // looks for the vendored runtime. Same origin, base-path aware, no CDN.
      // Populate it with `pnpm run vendor:pyodide`.
      window.HYPHON_PYODIDE_BASE_URL = `${import.meta.env.BASE_URL}pyodide/`;
    </script>
    <script type="module">
      // hyphon_native.js is an Emscripten ES module in public/, so Vite must not
      // transform it. `?url` gives the emitted path; the `@vite-ignore` comment
      // stops Vite rewriting the dynamic import (it would append `?import` and
      // 404). This used to be `new Function('url', 'return import(url)')`, which
      // required `unsafe-eval` — forbidden by the WAM2 Phase B CSP
      // (docs/adr/0001-wam2-host.md). A plain dynamic import needs no eval.
      const moduleUrl = `${import.meta.env.BASE_URL}hyphon_native.js`;
      const { default: Module } = await import(/* @vite-ignore */ moduleUrl);
      window.Module = await Module();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
